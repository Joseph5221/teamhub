version: '3.9'

services:
  api:
    build:
      context: ./TeamHub.Server
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=TeamHub-Dev
      - Jwt__Audience=TeamHub-Dev
    depends_on:
      - db
    volumes:
      - ./TeamHub.Server:/app
    command: dotnet watch run --no-launch-profile

  # Frontend Service
  frontend:
    build:
      context: ./teamhub-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5001
    volumes:
      - ./teamhub-frontend:/app
      - /app/node_modules
    command: npm run dev

  # Database Service
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=teamhub
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=teamhub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: